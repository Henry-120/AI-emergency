services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardia-ai-backend
    env_file:
      - .env.local
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    ports:
      - "8000:8000"
    volumes:
      - ./firebase-service-account.json.json:/run/secrets/firebase-service-account.json:ro
    restart: unless-stopped
